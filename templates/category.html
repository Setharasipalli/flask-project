{% extends "base.html" %}
{% block body %}
<h1>{{ category }}</h1>
{% for test in tests %}
<div class="test-card">
    <h2>{{ test.title }}</h2>
    <p>Difficulty: {{ test.difficulty }}</p>
    <p>
        {{ test.total_questions }} Questions |
        {{ test.duration }} Minutes
    </p>
    <a href="{{ url_for('start_mock_test' , test_id = test.id)}}">START TEST</a>
</div>
{% endfor %}
{% endblock %}
